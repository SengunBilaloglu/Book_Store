<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>
    <link rel="icon" type="image/png" href="./assets/icons/book-icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <script src="script.js"></script>
    <script src="template.js"></script>
</head>

<body onload="init()">

    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="./assets/icons/book-icon.png" alt="Logo" width="30" height="24">
                Bookstore</a>

            <a class="navbar-brand" href="favorites.html">
                <span class="heart">&#9829;</span>
                Favorites: 
                <span id="fav-number">0</span>
            </a>
        </div>
    </nav>

    <div class="container" id="container">

        <div class="card text-white bg-info" style="width: 18rem;">
            <h2 class="card-header" id="card-header">Header</h2>
            <div class="card-body img-body">
                <img src="./assets/icons/book.png">
            </div>
            <div class="card-body">
                <div class="price-and-likes">
                    <h5 class="book-price" id="book-price">Price</h5>
                    <div class="likes">
                        <h6 id="number-of-likes">1234</h6>
                        <button id="heart-btn" class="heart-btn" aria-label="Like" onclick="liked()">
                            <span class="heart">&#9829;</span>
                        </button>
                    </div>
                </div>
            </div>
            <hr>
            <div class="card-body">
                <p id="authors-name">p1</p>
                <p id="published-jahr">p2</p>
                <p id="genre">p3</p>
            </div>
            <hr>
            <div id="comments-body" class="card-body overflow-auto" style="max-height: 200px;">
                <h6>Kommentare:</h6>
            </div>
            <hr>

            <div class="card-body" style="padding-bottom: 0;">
                <div class="input-group input-group-sm mb-3" style="gap:5px">
                    <input id="new-comment" type="text" class="form-control" placeholder="Schreibe dein Kommentar..."
                        aria-describedby="inputGroup-sizing-sm">
                    <button class="send-btn" onclick="sendComment()">
                        <img src="./assets/icons/send-button-white.svg">
                    </button>
                </div>
            </div>
        </div>
        //hier


    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</body>

</html>
